<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drift — Verify Email</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #ffffff; --bg-soft: #f7f7f9; --text: #111118; --text-2: #555566;
      --text-3: #888899; --accent: #4a6bef; --green: #1a8a3e; --red: #c43c3c;
      --border: rgba(0,0,0,0.07);
    }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-soft); color: var(--text); line-height: 1.6;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: var(--bg); border: 1px solid var(--border); border-radius: 16px;
      padding: 48px 40px; max-width: 420px; width: 90vw; text-align: center;
      box-shadow: 0 4px 32px rgba(0,0,0,0.06);
    }
    .card-icon { font-size: 40px; margin-bottom: 16px; }
    .card h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
    .card p { font-size: 14px; color: var(--text-2); line-height: 1.6; margin-bottom: 24px; }
    .card a.btn {
      display: inline-block; padding: 12px 28px; background: var(--accent); color: #fff;
      font-size: 14px; font-weight: 600; text-decoration: none; border-radius: 10px;
      transition: opacity 0.15s;
    }
    .card a.btn:hover { opacity: 0.85; }
    .spinner {
      width: 32px; height: 32px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .success { color: var(--green); }
    .error { color: var(--red); }
    .logo { font-size: 18px; font-weight: 800; letter-spacing: -0.05em; color: var(--text-3); margin-bottom: 24px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">drift</div>
    <div id="state-loading">
      <div class="spinner"></div>
      <h1>Verifying your email...</h1>
      <p>Please wait a moment.</p>
    </div>
    <div id="state-success" style="display:none">
      <div class="card-icon">&#10003;</div>
      <h1 class="success">Email verified!</h1>
      <p>Your account is now active. You can close this page and return to the Drift extension.</p>
      <a href="/" class="btn">Go to Drift</a>
    </div>
    <div id="state-error" style="display:none">
      <div class="card-icon">&#10007;</div>
      <h1 class="error">Verification failed</h1>
      <p id="error-message">This verification link is invalid or has expired.</p>
      <a href="/" class="btn">Back to Drift</a>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://lbdiixdgsbhryulutpef.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_CxaOKaXH1tZ-WnATV8cPyQ_WpzbhdLA';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { detectSessionInUrl: true }
    });

    async function verify() {
      try {
        // Supabase magic link tokens are in the URL hash as #access_token=...&type=magiclink
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);

        const accessToken = params.get('access_token');
        const refreshToken = params.get('refresh_token');
        const type = params.get('type');

        if (accessToken && refreshToken) {
          // Set the session from the magic link tokens
          const { data, error } = await supabase.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken,
          });

          if (error) {
            showError(error.message);
            return;
          }

          // Success!
          document.getElementById('state-loading').style.display = 'none';
          document.getElementById('state-success').style.display = 'block';
          return;
        }

        // Also check for Supabase's auto-detection
        const { data: { session }, error } = await supabase.auth.getSession();
        if (session) {
          document.getElementById('state-loading').style.display = 'none';
          document.getElementById('state-success').style.display = 'block';
          return;
        }

        // Check URL query params (some flows use ?token=...)
        const queryParams = new URLSearchParams(window.location.search);
        const token = queryParams.get('token');
        const tokenHash = queryParams.get('token_hash');
        const emailType = queryParams.get('type');

        if (tokenHash && emailType) {
          const { error: verifyError } = await supabase.auth.verifyOtp({
            token_hash: tokenHash,
            type: emailType,
          });

          if (verifyError) {
            showError(verifyError.message);
          } else {
            document.getElementById('state-loading').style.display = 'none';
            document.getElementById('state-success').style.display = 'block';
          }
          return;
        }

        showError('No verification token found. Please check your email link.');
      } catch (err) {
        showError('Something went wrong. Please try signing in again.');
      }
    }

    function showError(msg) {
      document.getElementById('state-loading').style.display = 'none';
      document.getElementById('error-message').textContent = msg;
      document.getElementById('state-error').style.display = 'block';
    }

    verify();
  </script>
</body>
</html>
